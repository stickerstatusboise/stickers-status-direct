<title>Sticker Status Direct</title>
<meta name="description" content="Custom stickers made easy. Upload your artwork, choose size and quantity, approve your proof, and Sticker Status prints and ships.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F6F3F3; --surface:#FFFFFF; --ink:#0D0B0B; --ink-2:#2B2727; --muted:#6D6565; --line:#E8E2E2;
  --red:#E1102B; --red-hover:#C00A21; --red-soft:#FDE9EC; --red-ink:#B30B20;
  --black:#0D0B0B; --black-2:#171414; --on-black:#FFFFFF; --on-black-muted:#A49B9B; --black-line:#2D2828;
  --ok:#17804A; --ok-soft:#E3F3EA; --warn:#A96A00; --warn-soft:#FFF2D9;
  --shadow:0 1px 2px rgba(13,11,11,.06),0 10px 30px rgba(13,11,11,.08);
  --shadow-lg:0 2px 4px rgba(13,11,11,.06),0 24px 60px rgba(13,11,11,.16);
  --radius:16px;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D0B0B; --bg-2:#151212; --surface:#1B1818; --ink:#F6F2F2; --ink-2:#DDD6D6; --muted:#A1999A; --line:#2E2929;
    --red:#F2243E; --red-hover:#FF4058; --red-soft:#3A1219; --red-ink:#FF6B7E;
    --black:#050404; --black-2:#121010; --black-line:#2A2525;
    --ok:#4CC486; --ok-soft:#0F2E1E; --warn:#E9AE45; --warn-soft:#33260D;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0B0B; --bg-2:#151212; --surface:#1B1818; --ink:#F6F2F2; --ink-2:#DDD6D6; --muted:#A1999A; --line:#2E2929;
  --red:#F2243E; --red-hover:#FF4058; --red-soft:#3A1219; --red-ink:#FF6B7E;
  --black:#050404; --black-2:#121010; --black-line:#2A2525;
  --ok:#4CC486; --ok-soft:#0F2E1E; --warn:#E9AE45; --warn-soft:#33260D;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:20px}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;line-height:.95;letter-spacing:.01em;text-wrap:balance;margin:0;font-weight:900}
p{margin:0}
.h2{font-size:clamp(40px,6vw,76px)}
.h3{font-size:clamp(28px,3.4vw,40px)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:14px;display:block}
.lede{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:56ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:13.5px;transition:transform .15s,background .15s,box-shadow .15s,border-color .15s;white-space:nowrap;text-align:center}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-hover);transform:translateY(-1px);box-shadow:0 10px 24px rgba(225,16,43,.32)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ink:hover{transform:translateY(-1px)}
.btn-line{border:2px solid var(--line);background:var(--surface)}
.btn-line:hover{border-color:var(--ink)}
.btn-ghost-inv{border:2px solid rgba(255,255,255,.35);color:#fff}
.btn-ghost-inv:hover{border-color:#fff}
.btn-lg{min-height:58px;padding:0 30px;font-size:14.5px}
.btn-sm{min-height:36px;padding:0 14px;font-size:11.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.link{color:var(--red-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.ic{flex:none;vertical-align:middle}

/* Demo bar */
.demobar{background:#000;color:#fff;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.demobar .wrap{display:flex;align-items:center;gap:10px;min-height:38px;flex-wrap:wrap;padding-block:4px}
.demobar .tag-proto{background:var(--red);color:#fff;padding:2px 8px;border-radius:4px;font-weight:700}
.seg{display:inline-flex;background:#1c1919;border-radius:999px;padding:3px;gap:2px}
.seg button{padding:4px 12px;border-radius:999px;color:#bdb4b4;font-size:11.5px}
.seg button[aria-pressed="true"]{background:#fff;color:#000;font-weight:700}
.demobar .reset{color:#bdb4b4;text-decoration:underline;margin-left:auto}

/* Header */
.site-hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hd-row{display:flex;align-items:center;gap:18px;min-height:70px}
.logo{display:flex;align-items:center;gap:10px}
.logo-word{display:flex;flex-direction:column;line-height:.85}
.logo-word b{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.02em;text-transform:uppercase}
.logo-word i{font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.34em;color:var(--red);margin-top:3px}
.main-nav{display:flex;gap:2px;margin-left:12px}
.main-nav button{white-space:nowrap;padding:8px 11px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
.main-nav button:hover,.main-nav button[aria-current="page"]{color:var(--ink);background:var(--bg-2)}
.hd-tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{position:relative;width:42px;height:42px;border-radius:999px;display:grid;place-items:center}
.icon-btn:hover{background:var(--bg-2)}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;font-family:var(--mono)}
.burger{display:none}
.mobile-nav{border-top:1px solid var(--line);padding-block:10px 18px}
.mobile-nav button{display:block;width:100%;padding:13px 4px;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;border-bottom:1px solid var(--line)}
@media (max-width:1220px){.main-nav{display:none}.burger{display:grid}}
@media (max-width:560px){.hd-cta{display:none}.logo-word b{font-size:18px}}

.bell-pop{position:absolute;right:20px;top:64px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:60}
.bell-pop h4{font-size:18px;padding:14px 16px;border-bottom:1px solid var(--line)}
.bell-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%}
.bell-item:hover{background:var(--bg-2)}
.bell-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:7px;flex:none}
.bell-item.read .bell-dot{background:transparent}

/* Hero */
.hero{background:var(--black);color:var(--on-black);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:13%;top:-10%;bottom:-10%;width:64px;background:linear-gradient(90deg,var(--red) 0 38%,transparent 38% 62%,var(--red) 62%);opacity:.9;transform:skewX(-12deg)}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding-block:64px 72px;position:relative}
.hero .eyebrow{color:#ff5a6e}
.hero-h{font-size:clamp(58px,9.4vw,132px);line-height:.86;letter-spacing:-.005em}
.hero-h span{color:var(--red);display:block}
.hero .lede{color:#cfc6c6;margin-top:22px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-proof{display:flex;flex-wrap:wrap;gap:8px 18px;list-style:none;padding:0;margin:28px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:#bdb4b4;text-transform:uppercase}
.hero-proof li{display:flex;gap:6px;align-items:center}
.hero-proof svg{color:var(--red)}
.hero-art{position:relative;aspect-ratio:1/1;width:100%;max-width:560px;margin-inline:auto}
.hs{position:absolute;transition:transform .35s cubic-bezier(.2,.8,.2,1);animation:float 7s ease-in-out infinite}
.hs:hover{transform:scale(1.06)}
.hs .stk{width:100%;height:auto;display:block;transform:rotate(var(--r))}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;padding-block:44px 40px}.hero-art{max-width:420px}.hero::before{right:-10px;width:40px;opacity:.5}}

.ticker{background:var(--red);color:#fff;overflow:hidden;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.ticker-in{display:inline-flex;gap:0;padding-block:12px;animation:tick 38s linear infinite}
.ticker-in span{padding-inline:22px}
.ticker-in span::after{content:"●";margin-left:44px;font-size:12px;vertical-align:middle;opacity:.7}
@keyframes tick{to{transform:translateX(-50%)}}

/* Sections */
.sec{padding-block:96px}
.sec-alt{background:var(--bg-2)}
.sec-dark{background:var(--black);color:var(--on-black)}
.sec-dark .lede{color:var(--on-black-muted)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.sec-head .lede{margin-top:14px}
@media (max-width:700px){.sec{padding-block:64px}}

.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.step4{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px 28px;position:relative;overflow:hidden}
.step4 .n{font-family:var(--display);font-weight:900;font-size:76px;line-height:.8;color:var(--red);display:block;margin-bottom:22px}
.step4 h3{font-size:28px;margin-bottom:10px}
.step4 p{color:var(--muted);font-size:15px}
.step4 .arrow{position:absolute;right:18px;top:26px;color:var(--line)}
@media (max-width:980px){.steps4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.steps4{grid-template-columns:1fr}}
.journey{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.journey span{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}

/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:1040px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.pgrid{grid-template-columns:repeat(2,1fr);gap:10px}}
.pcard-btn{display:flex;flex-direction:column;width:100%;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.pcard-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:transparent}
.pcard-art{aspect-ratio:1/1;display:grid;place-items:center;padding:14%;background:var(--bg-2);position:relative}
.sec-alt .pcard-art{background:var(--bg)}
.pcard-art.paint{background:radial-gradient(120% 90% at 20% 10%,#3a3434 0,#141111 55%,#0a0808 100%)}
.pcard-art .stk{width:100%;height:auto;transition:transform .3s}
.pcard-btn:hover .stk{transform:rotate(-4deg) scale(1.04)}
.pcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard-body h3{font-size:25px}
.pcard-body p{color:var(--muted);font-size:14px}
.pcard-body .from{margin-top:auto;padding-top:8px;color:var(--ink);font-size:14px}
.tag{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:6px}
@media (max-width:560px){.pcard-body{padding:12px}.pcard-body h3{font-size:20px}.pcard-body p.blurb{display:none}}

/* why */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink)}
.why > div{padding:28px 28px 32px 0;border-bottom:1px solid var(--line)}
.why > div:not(:nth-child(3n+1)){padding-left:28px;border-left:1px solid var(--line)}
.why h3{font-size:30px;margin:12px 0 8px}
.why p{color:var(--muted)}
.why .ic{color:var(--red)}
@media (max-width:860px){.why{grid-template-columns:1fr}.why > div{padding:24px 0!important;border-left:0!important}}
.made-by{margin-top:40px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--black);color:#fff;border-radius:var(--radius);padding:24px 28px}
.made-by b{font-family:var(--display);font-size:30px;text-transform:uppercase;font-weight:900}
.made-by p{color:var(--on-black-muted);max-width:60ch}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.gal figure{margin:0;background:var(--black-2);border:1px solid var(--black-line);border-radius:14px;padding:22px 18px 14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.gal figure .stk{width:100%;height:auto;aspect-ratio:1/1}
.gal figcaption{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-black-muted);text-align:center}
@media (max-width:1000px){.gal{grid-template-columns:repeat(4,1fr)}}
@media (max-width:620px){.gal{grid-template-columns:repeat(2,1fr)}}

/* reviews */
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rev{border:1px solid var(--line);border-radius:var(--radius);padding:26px;background:var(--surface);display:flex;flex-direction:column;gap:14px}
.rev .stars{color:var(--red);letter-spacing:2px}
.rev blockquote{margin:0;font-size:18px;font-weight:500;line-height:1.45}
.rev footer{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.ph{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px dashed var(--muted);border-radius:4px;padding:2px 6px;color:var(--muted)}
@media (max-width:900px){.revs{grid-template-columns:1fr}}

/* bulk band */
.bulk{background:var(--black);color:#fff;border-radius:22px;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.bulk .lede{color:var(--on-black-muted);margin-top:16px}
.bulk-tiers{display:grid;gap:8px}
.bulk-tiers div{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--black-2);border:1px solid var(--black-line);border-radius:12px;font-family:var(--mono);font-size:14px}
.bulk-tiers b{font-family:var(--display);font-size:26px;font-weight:900}
.bulk-tiers .save{color:#ff6b7e;font-size:12px}
@media (max-width:860px){.bulk{grid-template-columns:1fr}}

/* faq */
.faq{max-width:880px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px 0;font-weight:700;font-size:19px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--display);font-size:34px;line-height:1;color:var(--red);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 22px;color:var(--muted);max-width:68ch}

.final-cta{background:var(--red);color:#fff;text-align:center;padding-block:96px}
.final-cta h2{font-size:clamp(52px,9vw,128px);line-height:.85}
.final-cta p{margin:20px auto 30px;max-width:48ch;font-size:19px;opacity:.9}
.final-cta .btn-ink{background:#0D0B0B;color:#fff}

.site-ft{background:var(--black);color:var(--on-black-muted);padding-block:56px 40px;font-size:14px}
.ft-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px}
.site-ft h4{font-size:18px;color:#fff;margin-bottom:12px}
.site-ft button{display:block;padding:4px 0;color:var(--on-black-muted)}
.site-ft button:hover{color:#fff}
.ft-base{margin-top:40px;padding-top:20px;border-top:1px solid var(--black-line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}
@media (max-width:760px){.ft-grid{grid-template-columns:1fr 1fr}.ft-grid > :first-child{grid-column:1/-1}}

/* Page header */
.page-hd{padding-block:44px 28px}
.page-hd h1{font-size:clamp(46px,7vw,88px)}
.crumbs{display:flex;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumbs button:hover{color:var(--ink)}

/* Configurator */
.cfg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;padding-block:28px 120px;align-items:start}
.cfg-left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)}
.stage{border-radius:22px;aspect-ratio:1/1;display:grid;place-items:center;padding:14%;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 15% 5%,#433b3b 0,#1a1616 45%,#0a0808 100%)}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);pointer-events:none}
.stage .stk{width:100%;height:auto;max-height:100%;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.stage-meta{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#bdb4b4;z-index:1;flex-wrap:wrap}
.stage-dim{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.5);color:#fff;font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:8px;z-index:1}
.stage-note{margin-top:12px;font-size:13px;color:var(--muted)}
.spec-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.spec-mini div{background:var(--bg-2);border-radius:12px;padding:10px 12px}
.spec-mini span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spec-mini b{font-size:14px}
.cfg-title h1{font-size:clamp(42px,5.4vw,68px)}
.cfg-title p{color:var(--muted);margin-top:10px}
.reorder-note{margin-top:16px;display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.step{padding-block:28px;border-bottom:1px solid var(--line)}
.step-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.step-hd .sn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--red)}
.step-hd h2{font-size:28px}
.step-hd .hint{margin-left:auto;font-size:13px;color:var(--muted)}
.tiles{display:grid;gap:10px}
.tiles-5{grid-template-columns:repeat(5,1fr)}
.tiles-6{grid-template-columns:repeat(6,1fr)}
.tiles-4{grid-template-columns:repeat(4,1fr)}

.opt{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}

.opt b{display:block}
.opt span{font-size:13.5px;color:var(--muted)}
.opt .price-add{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}

.drop{border:2.5px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;background:var(--bg-2);transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:8px}

.drop .fmts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.fmt{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.file .thumb img,.file .thumb .stk{width:100%;height:100%;object-fit:contain}
.file .fname{font-weight:700;font-size:14px;word-break:break-all}
.file .fmeta{font-size:12px;color:var(--muted)}
.file .acts{margin-left:auto;display:flex;gap:4px;flex:none}
.file .acts button{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:8px}
.file .acts button:hover{background:var(--bg-2)}
.design-help{margin-top:16px}
.dh-body{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl-s{font-size:13px;font-weight:700}
.inp,.field input,.field select,.field textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);transition:border-color .15s}

.price-box{margin-top:28px;border-radius:20px;background:var(--black);color:#fff;padding:24px}
.price-box .yp{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-black-muted)}
.price-total{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;margin-top:6px}
.price-per{font-family:var(--mono);font-size:14px;color:#ff8394;margin-top:6px}
.price-lines{margin:18px 0;padding:14px 0;border-block:1px solid var(--black-line);display:flex;flex-direction:column;gap:6px;font-size:14px;color:#d8d0d0}

.price-lines .mono{font-size:13px}
.price-foot{font-size:12px;color:var(--on-black-muted);margin-top:12px}
.form-err{background:var(--red-soft);color:var(--red-ink);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.flash{animation:flash .45s}
@keyframes flash{0%{color:#ff8394;transform:scale(1.03)}100%{color:inherit;transform:none}}
.mbar{display:none}
@media (max-width:900px){

  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--black);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));gap:12px;align-items:center;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .mbar .t{font-family:var(--display);font-weight:900;font-size:32px;line-height:.9}

}

/* Cart / checkout */

@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card + .card{margin-top:16px}
.card h2{font-size:28px;margin-bottom:16px}
.card h3{font-size:22px;margin-bottom:12px}
.citem{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.citem:first-child{padding-top:0}
.citem:last-child{border-bottom:0;padding-bottom:0}
.citem .art{border-radius:14px;aspect-ratio:1/1;display:grid;place-items:center;padding:12%;background:radial-gradient(120% 90% at 15% 5%,#433b3b 0,#1a1616 45%,#0a0808 100%)}
.citem .art .stk{width:100%;height:auto}
.citem h3{font-size:24px;margin-bottom:8px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}

.citem .pr{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

.sumlines{display:flex;flex-direction:column;gap:10px;font-size:15px}
.sumlines div{display:flex;justify-content:space-between;gap:12px}
.sumlines .tot{border-top:2px solid var(--ink);padding-top:14px;margin-top:4px;font-weight:800}
.sumlines .tot span:last-child{font-family:var(--display);font-size:34px;font-weight:900;line-height:1}
.sticky-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)}
.empty{text-align:center;padding:60px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}

.radio-card input{accent-color:var(--red);width:18px;height:18px}
.radio-card .rp{margin-left:auto;font-weight:800;font-family:var(--mono);font-size:13.5px}
.test-note{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
.card-field{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}

.mini-item .mi-art .stk{width:100%;height:100%}
.mini-item b{display:block;font-size:14px}
.mini-item span{font-size:12.5px;color:var(--muted)}
.mini-item .mp{margin-left:auto;font-weight:800;font-size:14px}

/* Tracker (dashboard look, single dark treatment) */
.trk{background:#0D0B0B;color:#fff;border-radius:22px;padding:clamp(20px,3.4vw,34px);position:relative;overflow:hidden}
.trk::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 120% at 100% 0,rgba(225,16,43,.22),transparent 60%);pointer-events:none}
.trk-head{display:flex;gap:18px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:28px;position:relative}
.trk-stage{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:#ff6b7e;font-weight:700;display:flex;gap:10px;align-items:center}
.trk-stage .live{width:8px;height:8px;border-radius:50%;background:#ff3550;box-shadow:0 0 10px #ff3550;animation:blink 1.2s infinite}
.trk-title{font-size:clamp(36px,5vw,62px);margin-top:10px;line-height:.9}
.trk-sub{color:#bdb4b4;margin-top:10px;max-width:56ch}
.trk-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;position:relative}
.trk-steps li{display:flex;flex-direction:column;gap:12px;min-width:0}
.led{height:16px;border-radius:4px;background:#2A2525;position:relative;overflow:hidden}
.led::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ff3a52,#d10c25);transform-origin:left center;transform:scaleX(0)}
.is-done .led::before,.is-now .led::before{transform:scaleX(1);animation:fillx .45s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--i) * 80ms)}
.is-now .led{box-shadow:0 0 22px rgba(255,53,80,.75)}
.is-now .led::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:sweep 1.6s ease-in-out infinite;animation-delay:.8s}
.trk-steps .lbl{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:16px;line-height:1.02;color:#6f6666}
.trk-steps .when{display:block;font-family:var(--mono);font-size:10.5px;color:#8d8484;margin-top:4px;letter-spacing:.02em;font-weight:400;text-transform:none}
.is-done .lbl{color:#fff}
.is-now .lbl{color:#ff5a6e}
.trk.compact{padding:16px 18px;border-radius:14px}
.trk.compact .trk-steps{gap:4px}
.trk.compact .led{height:8px}
.trk.compact .lbl{display:none}
.trk.compact .trk-head{display:none}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes filly{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sweep{to{transform:translateX(100%)}}
@keyframes blink{50%{opacity:.35}}
@media (max-width:760px){
  .trk:not(.compact) .trk-steps{grid-template-columns:1fr;gap:4px}
  .trk:not(.compact) .trk-steps li{flex-direction:row;gap:16px;align-items:stretch}
  .trk:not(.compact) .led{width:12px;height:auto;min-height:50px;flex:none}
  .trk:not(.compact) .led::before{transform-origin:center top}
  .trk:not(.compact) .is-done .led::before,.trk:not(.compact) .is-now .led::before{animation-name:filly}
  .trk:not(.compact) .is-now .led::after{background:linear-gradient(180deg,transparent,rgba(255,255,255,.55),transparent);transform:translateY(-100%);animation-name:sweepy}
  .trk:not(.compact) .trk-steps .lbl{font-size:21px;padding-top:4px}
}
@keyframes sweepy{to{transform:translateY(100%)}}

/* Account */
.acct-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:40px 20px}

@media (max-width:720px){.ocard{grid-template-columns:72px minmax(0,1fr)}.ocard .art{width:72px;height:72px}.ocard .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.ocard .acts .btn{flex:1}}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill[data-tone="attn"]{background:var(--red-soft);color:var(--red-ink)}

/* ---------- 2. PRICING (placeholder — replace calculatePrice with the real formula) ---------- */
const PRICING = {
  minOrder: 25,          // smallest sticker charge per line item
  baseUnit: 0.12,        // $ per sticker before size
  perSqIn: 0.055,        // $ per square inch per sticker
  volumeExponent: 0.32,  // how steeply price drops with quantity
  baseQty: 50,
  shapeMult: { diecut: 1.08, circle: 1, square: 1, rect: 1, oval: 1 },
};
function calculatePrice(cfg) {
  const { w, h } = dims(cfg);
  const qty = Math.max(CATALOG.minQty, Math.round(+cfg.qty || 0));
  const mat = byId(CATALOG.materials, cfg.material);
  const unitBase = (PRICING.baseUnit + w * h * PRICING.perSqIn) * mat.mult * (PRICING.shapeMult[cfg.shape] || 1);
  const volume = Math.pow(qty / PRICING.baseQty, -PRICING.volumeExponent);
  let stickers = Math.max(unitBase * volume * qty, PRICING.minOrder);
  const lines = [{ label: `${fmtQty(qty)} stickers`, amount: stickers }];
  let extras = 0;
  CATALOG.options.forEach(o => { if (cfg.options && cfg.options[o.id]) { const a = stickers * o.pct; extras += a; lines.push({ label: o.name, amount: a }); } });

  if (design) lines.push({ label: 'Design help', amount: design });
  const total = round2(stickers + extras + design);
  const per = (stickers + extras) / qty;
  const listUnit = unitBase; // price per sticker at the base quantity
  const savePct = Math.max(0, Math.round((1 - per / (listUnit * (1 + extras / stickers))) * 100));

function dims(c) {

const matName = id => byId(CATALOG.materials, id).name;
const product = id => byId(CATALOG.products, id);

function addFiles(list) {
  const arr = [...list]; const ok = []; const bad = [];
  arr.forEach(f => { const ext = f.name.split('.').pop().toLowerCase(); (CATALOG.uploadTypes.includes(ext) ? ok : bad).push(f); });
  if (bad.length) toast("That file type isn't supported", `${bad.map(f => f.name).join(', ')}. Use AI, EPS, SVG, PDF, PSD, PNG or JPG.`);
  if (!ok.length) return;
  let pending = ok.length; const out = [];
  const done = () => { if (--pending) return; const c = ui.cfg; if (ui.replaceIdx != null && c.files[ui.replaceIdx]) { c.files.splice(ui.replaceIdx, 1, ...out); } else c.files.push(...out); ui.replaceIdx = null; ui.cfgErr = ''; render(); toast(out.length > 1 ? `${out.length} files uploaded` : 'Artwork uploaded', out.map(f => f.name).join(', '), 'ok'); const a = $('#artwork'); a && a.scrollIntoView({ block: 'center' }); };
  ok.forEach((f, i) => { const ext = f.name.split('.').pop().toLowerCase(); const rec = { name: f.name, size: f.size, type: ext, url: null }; out[i] = rec; if (['png', 'jpg', 'jpeg', 'svg'].includes(ext) && f.size < 5e6) { const r = new FileReader(); r.onload = () => { rec.url = r.result; done(); }; r.onerror = done; r.readAsDataURL(f); } else done(); });
}

function tracker(o, compact = false) {
  const idx = STAGE_OF[o.status]; const done = o.status === 'delivered'; const [title, sub] = stageMsg(o);
  const when = []; o.log.forEach(l => { const s = STAGE_OF[l.status]; if (when[s] == null) when[s] = l.at; });
  return `<div class="trk ${compact ? 'compact' : ''}" role="group" aria-label="Order progress: ${STAGES[idx]}">
    <div class="trk-head"><div><p class="trk-stage">${done ? '' : '<span class="live"></span>'}STAGE ${idx + 1} OF 8 · ${o.id}</p><h2 class="trk-title">${title}</h2><p class="trk-sub">${sub}</p></div>
    ${o.status === 'proof_ready' && ui.view !== 'order' ? `<button class="btn btn-red" data-action="open-order" data-id="${o.id}" data-anchor="proof">Review proof</button>` : ''}
    ${o.status === 'shipped' && o.tracking ? `<a class="btn btn-red" href="${trackUrl(o.tracking)}" target="_blank" rel="noopener">${ic('truck', 18)} Track package</a>` : ''}</div>
    <ol class="trk-steps">${STAGES.map((s, i) => `<li class="${i < idx || done ? 'is-done' : ''} ${i === idx && !done ? 'is-now' : ''}" style="--i:${i}"><span class="led"></span><span class="lbl">${s}${when[i] && (i <= idx) ? `<span class="when">${fmtDT(when[i])}</span>` : ''}</span></li>`).join('')}</ol></div>`;
}

const proofPill = p => p.status === 'approved' ? '<span class="pill" data-tone="go">Approved</span>' : p.status === 'changes' ? '<span class="pill" data-tone="wait">Changes requested</span>' : '<span class="pill" data-tone="attn">Awaiting you</span>';

/* ----- PROOF SHEET ----- */
function proofSheet(o, p) {
  const it = o.items[0]; const d = dims(it); const { SW, SH } = pad18(d.w, d.h, it.shape); const vw = SW + 36, vh = SH + 36;
  const inset = `left:${(18 / vw * 100).toFixed(2)}%;right:${(18 / vw * 100).toFixed(2)}%;top:${(18 / vh * 100).toFixed(2)}%;bottom:${(18 / vh * 100).toFixed(2)}%`;
  const rad = it.shape === 'circle' || it.shape === 'oval' ? '50%' : it.shape === 'diecut' ? '18%' : '8%';
  const img = stickerSVG({ ...(p.url ? { url: p.url } : { art: p.art }), shape: it.shape, material: it.material, w: d.w, h: d.h, label: `Proof version ${p.v}` });
  return `<figure class="proof-sheet" style="margin:0"><div class="ps-head"><span><b>PROOF v${p.v}</b> · ${o.id}</span><span>${fmtDT(p.sentAt)}</span></div>
    <div class="ps-stage"><div class="ps-fig">${img}<span class="ps-cut" style="${inset};border-radius:${rad}"></span><span class="ps-dw" style="left:${(18 / vw * 100).toFixed(2)}%;right:${(18 / vw * 100).toFixed(2)}%"><span>${d.w.toFixed(2)} in</span></span><span class="ps-dh" style="top:${(18 / vh * 100).toFixed(2)}%;bottom:${(18 / vh * 100).toFixed(2)}%"><span>${d.h.toFixed(2)} in</span></span></div></div>
    <figcaption class="ps-foot"><span>${shapeName(it.shape)} · ${matName(it.material)} · ${fmtQty(it.qty)} pcs</span><span><i>- - -</i> cut line${it.shape === 'diecut' ? ' (follows outline)' : ''}</span></figcaption></figure>`;
}

/* ----- PRODUCTION ----- */
const prodLabel = o => o.status === 'approved' ? 'Queued' : o.status === 'production' ? (o.prodStage || 'Queued') : o.status === 'qc' ? 'Quality Check' : 'Ready to Ship';
const prodProgress = o => { const seq = ['Queued', 'Printing', 'Laminating', 'Cutting', 'Quality Check', 'Ready to Ship']; return (seq.indexOf(prodLabel(o)) + 1) / seq.length; };
function nextStep(o) { const l = prodLabel(o); return { Queued: 'Start printing', Printing: 'Laminate', Laminating: 'Cut', Cutting: 'Send to QC', 'Quality Check': 'Pass QC', 'Ready to Ship': 'Ship' }[l]; }
function vProduction() {
  const jobs = db.orders.filter(o => ['approved', 'production', 'qc', 'ready_to_ship'].includes(o.status)).sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
  const f = ui.prodFilter; const shown = f === 'All' ? jobs : jobs.filter(o => prodLabel(o) === f);
  const cnt = l => jobs.filter(o => prodLabel(o) === l).length;
  const dueToday = jobs.filter(o => o.dueDate && dayDiff(o.dueDate) <= 0).length;
  const filters = ['All', 'Queued', 'Printing', 'Laminating', 'Cutting', 'Quality Check', 'Ready to Ship'];
  return `<div class="prod"><div class="prod-top"><h1>Production <i>Queue</i></h1><span class="mono small" style="color:#8d8484">Sticker Status Direct · Print floor</span><span class="clock num" id="clock">${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span></div>
    <div class="prod-stats"><div><span>Jobs on board</span><b>${jobs.length}</b></div><div><span>Queued</span><b>${cnt('Queued')}</b></div><div><span>On press</span><b>${cnt('Printing') + cnt('Laminating') + cnt('Cutting')}</b></div><div><span>QC / Pack</span><b>${cnt('Quality Check') + cnt('Ready to Ship')}</b></div><div class="${dueToday ? 'hot' : ''}"><span>Due today / late</span><b>${dueToday}</b></div></div>
    <div class="prod-filters" role="group" aria-label="Filter by stage">${filters.map(x => `<button data-action="prod-filter" data-v="${x}" aria-pressed="${f === x}">${x}${x !== 'All' ? ` · ${cnt(x)}` : ''}</button>`).join('')}</div>
    <div class="jobs">${shown.map(o => { const it = o.items[0]; const dd = o.dueDate ? dayDiff(o.dueDate) : 9; const dueTxt = dd < 0 ? 'OVERDUE' : dd === 0 ? 'DUE TODAY' : dd === 1 ? 'DUE TOMORROW' : 'DUE ' + new Date(o.dueDate).toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' }).toUpperCase(); const rush = it.options.rush;
      return `<article class="job ${dd < 0 ? 'overdue' : ''}">${rush ? '<span class="rush">RUSH</span>' : ''}<div class="job-strip"><i style="width:${Math.round(prodProgress(o) * 100)}%"></i></div><div class="job-main"><div class="job-art">${orderThumb(o)}</div><div style="min-width:0"><div class="jid">${o.id}</div><div class="jc">${esc(o.customer.company || o.customer.name)}</div><div class="jqty num">${fmtQty(it.qty)} <small>pcs</small></div><div class="jspec"><span>${shapeName(it.shape)}</span><span>${dimLabel(it)}</span><span>${matName(it.material)}</span>${it.options.laminate ? '<span>Laminate</span>' : ''}</div></div></div>
      <div class="job-foot"><span class="due ${dd < 0 ? 'late' : dd === 0 ? 'today' : ''}">${dueTxt}</span><span class="pstat">${prodLabel(o)}</span><button class="btn btn-sm" data-action="prod-next" data-id="${o.id}">${nextStep(o)} ${ic('arrow', 14)}</button></div></article>`; }).join('') || '<p style="color:#8d8484;padding:20px">No jobs in this stage.</p>'}</div></div>`;
}

/* ---------- render ---------- */
let clockTimer = null;
function render() {
  const keep = {}; document.querySelectorAll('[data-keep-scroll]').forEach(el => keep[el.dataset.keepScroll] = el.scrollTop);
  const v = ui.view; let html = demoBar();
  if (v === 'admin') html += vAdmin();
  else if (v === 'production') html += vProduction();
  else {
    const views = { home: vHome, shop: vShop, business: vBusiness, configure: vConfigure, cart: vCart, checkout: vCheckout, confirm: vConfirm, account: vAccount, order: vOrder, track: vTrack };
    html += header() + `<main id="main">${(views[v] || vHome)()}</main>` + footer();
  }
  $('#app').innerHTML = html;
  document.body.classList.toggle('has-mbar', v === 'configure');
  document.querySelectorAll('[data-keep-scroll]').forEach(el => { if (keep[el.dataset.keepScroll] != null) el.scrollTop = keep[el.dataset.keepScroll]; });
  clearInterval(clockTimer);
  if (v === 'production') clockTimer = setInterval(() => { const c = $('#clock'); if (c) c.textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }, 20000);
}

/* ---------- actions ---------- */
function currentProofOf(o) { return o.proofs[o.proofs.length - 1]; }
function approveProof(o) {
  const p = currentProofOf(o); const t = nowISO();
  p.status = 'approved'; p.respondedAt = t; o.approvedAt = t;
  o.dueDate = addBusinessDays(t, o.items.some(i => i.options.rush) ? 1 : 3);
  logEvent(o, 'approved', `Customer approved proof v${p.v} (locked as production artwork)`, 'Customer');
  o.status = 'production'; o.prodStage = 'Queued';
  logEvent(o, 'production', 'Moved to production queue automatically', 'System');
  save();
}

  'adm-ship': form => {
    const d = Object.fromEntries(new FormData(form)); const o = getOrder(ui.adminOrder);
    o.tracking = { carrier: d.carrier, number: d.number.trim(), shipDate: new Date(d.shipDate + 'T12:00').toISOString(), eta: new Date(d.eta + 'T12:00').toISOString() };
    o.status = 'shipped'; logEvent(o, 'shipped', `Shipped via ${d.carrier} · ${d.number}`, 'Staff');
    notify(o.customer.email, o.id, 'Your stickers shipped', `${o.id} is on the way with ${d.carrier}.`); save(); render(); toast('Marked shipped', `Customer notified with ${d.carrier} tracking.`, 'ok');
  },
};

/* ---------- event wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) { if (ui.bell && !e.target.closest('.bell-pop')) { ui.bell = false; render(); } return; }
  const fn = A[el.dataset.action]; if (fn) { if (el.tagName === 'A') return; if (el.dataset.action !== 'modal-close-bg') e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').innerHTML) closeModal(); else if (ui.adminOrder && ui.view === 'admin') A['adm-close'](); else if (ui.bell || ui.menu) { ui.bell = ui.menu = false; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-keyclick]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.matches('tr[data-action]')) A['adm-open'](e.target);
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form] && FORMS[f.dataset.form](f); });
document.addEventListener('input', e => {
  const b = e.target.dataset.bind; if (!b) return; const c = ui.cfg;
  if (b === 'cw' || b === 'ch') { c[b] = e.target.value; refreshCfg(true); }
  else if (b === 'qty') { const v = parseInt(e.target.value, 10); if (v >= CATALOG.minQty) { c.qty = v; refreshCfg(true); } }
  else if (b === 'designNotes') { c.designNotes = e.target.value; }
  else if (b === 'adminQ') { ui.adminQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#adm-q'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const t = e.target; const b = t.dataset.bind;
  if (t.id === 'file-in') { addFiles(t.files); t.value = ''; return; }
  if (t.id === 'adm-proof-in') { const f = t.files[0]; if (!f) return; const ext = f.name.split('.').pop().toLowerCase(); if (['png', 'jpg', 'jpeg', 'svg'].includes(ext)) { const r = new FileReader(); r.onload = () => { ui.pendingProof = { url: r.result, name: f.name }; render(); }; r.readAsDataURL(f); } else { const o = getOrder(ui.adminOrder); ui.pendingProof = { ...itemArt(o.items[0]), name: f.name }; render(); } return; }
  if (!b) return;
  if (b.startsWith('opt:')) { ui.cfg.options[b.slice(4)] = t.checked; refreshCfg(true); }
  else if (b === 'designHelp') { ui.cfg.designHelp = t.checked; ui.cfgErr = ''; render(); if (t.checked) { const n = $('#dh-notes'); n && n.focus({ preventScroll: true }); } }
  else if (b === 'ship') { ui.shipMethod = t.value; $('#co-summary').outerHTML = coSummary(); }
  else if (b === 'sameBill') { ui.sameBill = t.checked; const s = window.scrollY; render(); window.scrollTo(0, s); }
  else if (b === 'qty') { const v = parseInt(t.value, 10); if (!(v >= CATALOG.minQty)) { t.value = ''; toast(`Minimum order is ${CATALOG.minQty} stickers`); } else render(); }
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('is-over'); } }));
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('is-over'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('is-over'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ---------- boot ---------- */
(function boot() {
  const h = (location.hash || '').slice(1);
  const ok = ['home', 'shop', 'business', 'cart', 'account', 'track', 'admin', 'production'];
  ui.view = ok.includes(h) ? h : 'home';
  if (h === 'checkout' && db.cart.length) ui.view = 'checkout';
  render();
})();

</script>
